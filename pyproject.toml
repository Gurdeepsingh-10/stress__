[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stress"
version = "0.1.0"
description = "Personalized stress monitoring platform from wearable physiological signals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Gurdeep Singh"}
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "mlflow>=2.10",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "onnx>=1.14",
    "onnxruntime>=1.16",
]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "joblib>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "httpx>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stress"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --tb=short"
